# Curated labour-market seeds.
#
# These numbers are *curated estimates*, not live postings data. Every surface
# that shows them prints the `label` below. Occupations are grouped into
# families; a future free API key (Adzuna / CareerOneStop) overrides these
# values automatically at runtime — see career_guidance/market_seed.py.
#
# Salary figures are annual gross, in the local currency of `currency`:
#   * INR (₹) — India, mid-market, 2026 money
#   * USD ($) — United States
#
# trend:    rising | stable | declining
# demand:   1 (very low) … 5 (very high) — hiring pressure over the next ~2 years
version: 1
updated: "2026-09"
label: "Source: curated, updated 2026-09"
currency_in: INR
currency_us: USD

# Defaults applied when an occupation is not matched by any rule below.
defaults:
  trend: stable
  demand: 3
  remote: false
  salary_in: [400000, 700000, 1200000] # p25, p50, p75
  salary_us: [45000, 65000, 95000]

# Rules are matched (in order) against an occupation's title and O*NET family
# code prefix (e.g. 15-xxxx is Computer & Mathematical). The first match wins.
families:
  - id: software-engineering
    match: ["software", "developer", "programmer", "web", "full stack", "devops", "computer systems", "applications", "qa", "test", "site reliab", "cloud", "mobile"]
    code_prefixes: ["15-11", "15-12", "15-13", "15-1199"]
    inr: [600000, 1200000, 2200000]
    usd: [78000, 112000, 160000]
    trend: rising
    demand: 5
    remote: true
    indian_titles: ["Software Engineer", "SDE-1", "Full Stack Developer", "Backend Engineer", "MERN Developer", "Java Developer", ".NET Developer", "SDET"]
  - id: data-and-analytics
