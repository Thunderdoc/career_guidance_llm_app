# City-centre coordinates for the Kaam-Vaani radius filter (Step 8.3).
#
# SOURCE: geocoded 21 Nov 2026 via the map geocoder (state Tamil
# Nadu, country India) — every entry matched at CITY level,
# relevance 100. Sanity-checked by rough distance: Madurai–
# Virudhunagar ~40 km, Madurai–Dindigul ~49 km, Madurai–
# Tirunelveli ~133 km, Chennai–Madurai ~350 km — all consistent
# with known road distances.
#
# SCOPE: only the 6 cities the seed listings use. Listings carry a
# city name only (no street address), so the radius is city-centre
