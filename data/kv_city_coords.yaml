# listing in a city with no entry here is EXCLUDED from radius
# results (it still appears in the plain city filter), and a radius
# search centred on an unmapped city is a 400 with the mapped
# cities listed (LIMITATIONS.md L57). Add cities by geocoding
# them the same way and appending here — never from memory.
