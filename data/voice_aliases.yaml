# Spoken-form skill aliases for the voice flow — the single source of truth
# for both the frontend vocabulary generator (scripts/gen_voice_vocab.py)
# and the backend deterministic extractor (career_guidance/kaamvaani/extract.py),
# so both paths agree by construction (Stage 2).
#
# Curated spoken forms school-leavers actually say ("farming", "tailoring",
# "mobile repair", ...) mapped to canonicals that exist in
# data/skill_synonyms.yaml. Devanagari / Tamil-script forms included:
# Chrome's hi-IN / ta-IN recognition returns native script, not
# transliteration. Every value must be a canonical in the YAML — both
# consumers fail loudly if one is not, so the vocabulary can never
# invent a skill.
#
# After editing: regenerate the frontend vocabulary with
#   python scripts/gen_voice_vocab.py
# and re-run the Kaam-Vaani eval (python -m eval.run_kv).
