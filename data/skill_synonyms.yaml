# Skill normaliser dictionary — aliases → canonical O*NET-style skills.
#
# This file is the *offline* seed. Admins can add/override entries at runtime
# (admin console → Skills & synonyms); those live in the `synonyms` table and
# win over this file. `expands` lists the taxonomy terms a canonical skill
# should also count as (used by the matcher), which is how "tally" reaches
# occupations whose technology list says "Accounting software".
#
# Conventions
#   skills:            canonical key → { expands: [...], aliases: [...] }
#   aliases:           lower-case; user text is lower-cased and trimmed first
#   unicode aliases:   Tamil / Hindi / Devanagari transliterations people type
#
