# Kaam-Vaani multilingual glossary (Step 7A).
#
# Tamil / Hindi / Roman occupation, skill and trade terms -> the English
# query terms they mean, for retrieval against the English-only knowledge
# base. A Tamil/Hindi question is translated word-by-word (longest phrase
# first) and the English translation is what the retriever scores; Latin
# tokens in the query (PMKVY, NSDC, "free online course") pass through
# unchanged. Unmatched non-Latin tokens are dropped.
#
# Sources: the terms in eval/kv_golden.json (kv-r042-r103), the attested
# spoken forms in data/voice_aliases.yaml, and standard Tamil/Hindi
# occupation vocabulary. Every entry was checked against the question it
# serves — no entry exists for a term nobody asks about. The glossary is
# a retrieval aid, not a translator: it does not translate answers, and
# the assistant still answers in English from the English KB (see
# LIMITATIONS.md L16).
#
# Inflected forms that appear in real questions are listed explicitly
# (e.g. Tamil dative -க்கு, Hindi oblique plural -ों); the matcher also
# strips a small set of Tamil suffixes and retries (see translate.py).
version: 1

