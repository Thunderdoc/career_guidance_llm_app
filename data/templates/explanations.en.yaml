  match.jobzone_gap: "This sits {zone_distance} zone(s) {direction} your current level — expect a stretch."
  match.demand: "Demand is {demand} ({source})."
  match.salary: "Typical pay {salary_band} ({currency} per year), {source}."
  match.resources: "{resource_count} free course(s) attached for {gap}."
  match.why_skills: "Skills: {skills_score}%"
