# Template explanation sentences (English).
#
# Every sentence shown in the UI is assembled from data — no LLM is involved.
# Placeholders in {braces} are filled by career_guidance/explanations.py.
# Admins can edit these at runtime (admin console → Assessment & templates).
locale: en
updated: "2026-09"
templates:
