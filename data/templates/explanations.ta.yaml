# Template explanation sentences (Tamil / தமிழ்).
locale: ta
updated: "2026-09"
templates:
  match.headline: "{title} பணிக்குத் தேவையான {total_skills} முக்கிய திறன்களில் {matched_count} உங்களிடம் உள்ளது."
  match.strongest: "மிகச் சிறந்த பொருத்தம்: {strongest}."
  match.gap: "மிகப்பெரிய இடைவெளி: {gap}."
  match.missing: "{missing_count} திறன்கள் இல்லை; முதலில் {gap} கற்கவும்."
  match.interests: "உங்கள் {interest_top} ஆர்வ வகை இந்தப் பணிக்குப் பொருந்துகிறது ({interest_pct}% ஆர்வப் பொருத்தம்)."
  match.interests_weak: "ஆர்வப் பொருத்தம் {interest_pct}% மட்டுமே — செய்யக்கூடியது, ஆனால் தினசரி வேலையைப் பாருங்கள்."
  match.jobzone: "வேலை மண்டலம் {job_zone} — பொதுவாக {job_zone_label}; உங்கள் சுயவிவரம் மண்டலம் {target_zone} ஐ குறிக்கிறது."
  match.jobzone_fit: "வேலை மண்டலம் {job_zone} ({job_zone_label}) உங்கள் கல்வி மற்றும் அனுபவத்திற்குப் பொருந்துகிறது."
  match.jobzone_gap: "இது உங்கள் நிலையை விட {zone_distance} மண்டலம் {direction} — சவாலானது."
  match.demand: "தேவை {demand} ({source})."
  match.salary: "வழக்கமான ஊதியம் {salary_band} ({currency} ஆண்டுக்கு), {source}."
  match.resources: "{gap} க்கான {resource_count} இலவச பாடங்கள் இணைக்கப்பட்டுள்ளன."
  match.why_skills: "திறன்கள்: {skills_score}%"
  match.why_interests: "ஆர்வம்: {interest_score}%"
  match.why_zone: "வேலை மண்டலப் பொருத்தம்: {zone_score}%"
  gap.status_strong: "வலுவானது — நீங்கள் {rating}/5 என மதிப்பிட்டுள்ளீர்கள்."
  gap.status_weak: "பலவீனம் — இதைப் பயிற்சி செய்யுங்கள் ({rating}/5)."
  gap.status_missing: "இல்லை — இங்கே தொடங்குங்கள் ({rating}/5)."
  readiness.summary: "{title} க்கு தயார்நிலை {readiness}% ({strong} வலுவான, {weak} பலவீன, {missing} இல்லாத திறன்கள்)."
  readiness.next: "அடுத்ததாக {gap} ஐ மூடுங்கள்: இது பணியின் முக்கியத்துவத்தில் {importance}%."
  roadmap.summary: "{weeks} வார திட்டம், வாரம் {hours} மணி: தயார்நிலை {readiness_before}% → {readiness_after}%, {eta} இல் முடிவு."
  roadmap.milestone: "வாரம் {week}: {skill} முடிக்கவும் ({hours} மணி) — பிறகு மீண்டும் மதிப்பிடுங்கள்."
  roadmap.item: "வாரம் {week} · {skill}: {hours} மணி."
  transition.hop: "{title} வழியாக (+{delta_count} திறன்கள்: {delta})."
  transition.found: "{from_title} இலிருந்து {to_title} வரை {hops} படி."
  transition.same: "நீங்கள் ஏற்கனவே {title} ஐப் பார்க்கிறீர்கள்."
  transition.missing: "தொடர்புடைய தொழில் வரைபடத்தில் 3 படிகளுக்குள் பாதை இல்லை."
  interview.behavioural: "{task} செய்ய {skill} ஐ எப்படி பயன்படுத்தியீர்கள் என்பதை விவரியுங்கள்."
  interview.technical: "{skill} ஐப் பயன்படுத்தி {task} ஐ எவ்வாறு அணுகுவீர்கள்?"
  resume.headline: "{title} க்கு எதிராக ரெஸ்யூமி மதிப்பெண் {score}/100 ({grade})."
  resume.coverage: "முக்கியச் சொல் பூர்த்தி {percent}% — {missing_count} சொற்கள் இல்லை, {gap} முதலில்."
  resume.impact: "{bullets} புள்ளிகளில் {quantified} எண்ணிக்கை/முடிவைக் காட்டுகின்றன."
  resume.verbs: "{verb_count} வலுவான செயல் வினைச்சொற்கள் உள்ளன."
  resume.sections: "கண்டறியப்பட்ட பிரிவுகள்: {sections}."
  resume.next: "அடுத்த திருத்தம்: {suggestion}"
  compare.headline: "மூன்றிலும் பொதுவானவை: {shared}."
  learn.hint: "{skill} · {level} · {provider}."
  source.template: "மூலம்: டெம்ப்ளேட் இயந்திரம் (புதுப்பிக்கப்பட்டது {updated})"
