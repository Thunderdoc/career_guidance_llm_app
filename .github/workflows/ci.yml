name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Lint · test · eval (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q -p no:warnings
      - name: Coverage gate (≥ 85%)
        run: >-
          pytest -q -p no:warnings --cov=career_guidance --cov=backend
          --cov-report=term-missing --cov-fail-under=85
      - run: python -m eval.run --min-hit 0.75
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/report.json

  web:
    name: Lint · typecheck · build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: NEXT_EXPORT=1 npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [python, web]
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Plain buildx so the full log lands in the job output and the tail can be
      # reported below; the GHA layer cache is deliberately not used (mode=max
      # exports of ~1 GB failed against the 10 GB repo quota).
      - name: Resources
        run: free -m; df -h /var/lib/docker 2>/dev/null | tail -1
      - name: Build the web stage only
        run: |
          set -o pipefail
          docker buildx build --progress=plain --target web --push=false -t cg-web:ci . 2>&1 | tee /tmp/web.log | tail -15
      - name: Build the full image
        if: success() || failure()
        run: |
          set -o pipefail
          docker buildx build --progress=plain --push=false -t career-guidance:ci . 2>&1 | tee /tmp/full.log | tail -15
      - name: Report the failing tail on the PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "#### Docker build failed on \`$GITHUB_SHA\`"
            echo '```text'
            echo "--- free ---"; free -m || true
            echo "--- oom events ---"; sudo dmesg 2>/dev/null | grep -iE "oom|killed process" | tail -5 || true
            echo "--- web stage tail ---"; tail -n 60 /tmp/web.log 2>/dev/null || true
            echo "--- full build tail ---"; tail -n 60 /tmp/full.log 2>/dev/null || true
            echo '```'
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --repo "${{ github.repository }}" --body-file /tmp/comment.md || echo "(no PR to comment on)"
