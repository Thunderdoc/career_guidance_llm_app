name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Lint · test · eval (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q -p no:warnings
      - name: Coverage gate (≥ 85%)
        run: >-
          pytest -q -p no:warnings --cov=career_guidance --cov=backend
          --cov-report=term-missing --cov-fail-under=85
      - run: python -m eval.run --min-hit 0.75
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/report.json

  web:
    name: Lint · typecheck · build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: NEXT_EXPORT=1 npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
