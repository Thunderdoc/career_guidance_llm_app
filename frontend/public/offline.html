<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Career Guidance AI</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: #0f0f0f; color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 30rem; padding: 2rem; text-align: center; }
      h1 { font-family: "Instrument Serif", Georgia, serif; font-size: 2rem; margin: 0 0 0.5rem; }
      p { color: #9a9a9a; line-height: 1.6; }
      a {
        display: inline-block; margin-top: 1.25rem; padding: 0.6rem 1.1rem; border-radius: 0.75rem;
        background: rgba(0, 212, 170, 0.15); color: #00d4aa; text-decoration: none;
        border: 1px solid rgba(0, 212, 170, 0.3);
      }
      .dot { color: #00d4aa; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        <span class="dot">●</span> The app shell is cached, but your dashboard, plan and résumé
        analysis are fetched live from the server, so they need a connection.
      </p>
      <p>Reconnect and try again — nothing you saved has been lost.</p>
      <a href="/dashboard">Retry</a>
    </main>
  </body>
</html>
