stages: [lint, test, build]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

.python:
  image: python:3.11-slim
  before_script:
    - pip install --no-cache-dir -r requirements-dev.txt
  cache:
    key: { files: [requirements-dev.txt] }
    paths: [.cache/pip]

lint:python:
  extends: .python
  stage: lint
  script:
    - ruff check .
    - ruff format --check .

lint:web:
  image: node:22-alpine
  stage: lint
  cache:
    key: { files: [frontend/package-lock.json] }
    paths: [.cache/npm]
  script:
    - cd frontend && npm ci --no-audit --no-fund
    - npx tsc --noEmit
    - npx eslint .

test:
  extends: .python
  stage: test
  script:
    - pytest --junitxml=report.xml -p no:warnings
    - python -m eval.run --min-hit 0.7
  artifacts:
    when: always
    reports: { junit: report.xml }
    paths: [eval/report.json]

build:web:
  image: node:22-alpine
  stage: build
  script:
    - cd frontend && npm ci --no-audit --no-fund && NEXT_EXPORT=1 npm run build
  artifacts:
    paths: [frontend/out]
    expire_in: 1 week

build:docker:
  image: docker:27
  services: [docker:27-dind]
  stage: build
  script:
    - docker build -t career-guidance-ai:$CI_COMMIT_SHORT_SHA .
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
